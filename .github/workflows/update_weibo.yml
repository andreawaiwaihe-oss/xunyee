name: Update Weibo Chaohua CSV

on:
  workflow_dispatch:
  schedule:

    # 新增：补一个中国时间 23:59 的最后更新 = UTC 15:59
    - cron: '59 15 * * *'

permissions:
  contents: write

concurrency:
  group: update-weibo
  cancel-in-progress: false

jobs:
  update-weibo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weibo chaohua script
        env:
          WEIBO_AUTHORIZATION: ${{ secrets.WEIBO_AUTHORIZATION }}
          WEIBO_GSID: ${{ secrets.WEIBO_GSID }}
          WEIBO_AID: ${{ secrets.WEIBO_AID }}
          WEIBO_X_SESSIONID: ${{ secrets.WEIBO_X_SESSIONID }}
          WEIBO_X_VALIDATOR: ${{ secrets.WEIBO_X_VALIDATOR }}
          WEIBO_X_SHANHAI_PASS: ${{ secrets.WEIBO_X_SHANHAI_PASS }}
        run: |
          python weibo_chaohua_data.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add weibo_chaohua_data.csv weibo_chaohua_data_history.csv

          if git diff --cached --quiet; then
            echo "No Weibo CSV changes to commit."
          else
            git commit -m "Auto update Weibo chaohua CSV"
            git pull --rebase origin main
            git push origin main
          fi
