name: Update Xunyee CSV

on:
  schedule:
    - cron: "*/5 * * * *"
    # 中国时间 10:00
    - cron: "0 2 * * *"

    # 中国时间 12:00
    - cron: "0 4 * * *"

    # 中国时间 18:00
    - cron: "0 10 * * *"

    # 中国时间 23:59
    - cron: "59 15 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-xunyee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Xunyee data script
        env:
          XUNYEE_TOKEN: ${{ secrets.XUNYEE_TOKEN }}
          XUNYEE_JSESSIONID: ${{ secrets.XUNYEE_JSESSIONID }}
        run: |
          python xunyee_get_data.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add xunyee_like_fans_count.csv

          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
          else
            git commit -m "Auto update Xunyee CSV"
            git push
          fi
