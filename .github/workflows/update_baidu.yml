name: Update Baidu Flower CSV

on:
  workflow_dispatch:
  schedule:
    

    # 中国时间 10:00 = UTC 02:00
    - cron: '0 2 * * *'

    # 中国时间 12:00 = UTC 04:00
    - cron: '0 4 * * *'

    # 中国时间 18:00 = UTC 10:00
    - cron: '0 10 * * *'

    # 中国时间 23:59 = UTC 15:59
    - cron: '59 15 * * *'

permissions:
  contents: write

jobs:
  update-baidu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Baidu flower script
        env:
          BAIDU_COOKIE: ${{ secrets.BAIDU_COOKIE }}
        run: |
          python baidu_flower_data.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add baidu_send_flower_data.csv

          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
          else
            git commit -m "Auto update Baidu flower CSV"
            git pull --rebase origin main
            git push origin main
          fi
